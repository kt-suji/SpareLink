[package]
name = "sparelink-agent"
version = "0.1.0"
edition = "2024"
description = "Lightweight P2P surplus compute discovery and telemetry agent"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[[bin]]
name = "sparelink-agent"
path = "src/main.rs"

[[bin]]
name = "sparelink-bench"
path = "src/bin/bench_cli.rs"